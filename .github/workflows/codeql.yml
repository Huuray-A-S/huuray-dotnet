name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 2'
  # Pull requests are disabled on this repository, so this is how a branch is analysed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning requires GitHub Advanced Security, which is included for
    # public repositories and licensed separately for private ones. While this
    # repository is private the analysis itself succeeds and only the upload
    # fails, which would leave a permanent red X that means nothing. Skip
    # instead; this starts running by itself the moment the repo goes public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for analysis
        run: dotnet build Huuray.sln --configuration Release

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
